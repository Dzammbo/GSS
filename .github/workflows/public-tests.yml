name: Public calculation tests
on:
  push:
    paths:
      - 'src/**'
      - 'tests/**'
      - '.github/workflows/public-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run synthetic-only tests
        run: python -m unittest discover -s tests -v
